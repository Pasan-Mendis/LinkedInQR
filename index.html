<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ===== Open Graph Meta Tags ===== -->
  <meta property="og:title" content="I'm attending FutureTech Summit 2026!" />
  <meta property="og:description" content="Excited to connect, learn, and innovate at FutureTech Summit 2026." />
  <meta property="og:image" content="https://github.com/Pasan-Mendis/LinkedInQR/blob/fff91cd814e66aa5b3d818bcb87c30a4a159e5dd/banner.jpg" />
  <meta property="og:url" content="https://pasan-mendis.github.io/LinkedInQR/" />
  <meta property="og:type" content="website" />

  <!-- ===== LinkedIn Preview ===== -->
  <meta name="twitter:card" content="summary_large_image" />

  <title>FutureTech Summit 2026</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      width: 100%;
      background: #1e293b;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      text-align: center;
    }

    .banner {
      width: 100%;
      height: 240px;
      object-fit: cover;
    }

    .content {
      padding: 30px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 15px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 15px 25px;
      background: #0a66c2;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background: #004182;
    }

    .footer {
      margin-top: 25px;
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Replace with your event banner -->
    <img
      class="banner"
      src="https://yourdomain.com/banner.jpg"
      alt="Event Banner"
    />

    <div class="content">
      <h1>🎉 Welcome to FutureTech Summit 2026</h1>

      <p>
        Thank you for attending!  
        Share your experience on LinkedIn and let your network know you're part of the event.
      </p>

      <!-- ===== LinkedIn Share Button ===== -->
      <a
        class="btn"
        target="_blank"
        href="https://www.linkedin.com/sharing/share-offsite/?url=https://yourdomain.com/share.html"
      >
        Share on LinkedIn
      </a>

      <div class="footer">
        #FutureTech2026 #Innovation #Networking
      </div>
    </div>
  </div>

</body>
</html>
